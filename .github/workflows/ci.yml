name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Check for build artifacts
      run: |
        node -e "console.log('Native module loaded successfully'); const r = require('./index'); console.log('Module exports:', Object.keys(r));"

  # Node 18 is supported on a best-effort basis. The dev toolchain (mocha 12)
  # needs Node 20+, so install the package the way users do (no dev deps) and
  # run the test suite with the last mocha that supports Node 18.
  test-node18:
    name: Test on ${{ matrix.os }} with Node 18.x
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install production dependencies and build
      run: npm ci --omit=dev

    - name: Smoke test
      run: |
        node -e "const r = require('./index'); const o = r.parse('<a><b>1</b></a>'); if (o.b !== 1) throw new Error('unexpected result: ' + JSON.stringify(o)); r.parseAsync(Buffer.from('<a><b>2</b></a>')).then(o => { if (o.b !== 2) throw new Error('unexpected async result: ' + JSON.stringify(o)); console.log('Node 18 smoke test passed'); });"

    - name: Run tests
      run: npx --yes mocha@11.7.5

  lint:
    name: Check README and package.json
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24.x'

    - name: Verify package.json
      run: |
        node -e "const pkg = require('./package.json'); console.log('Package:', pkg.name, pkg.version);"

    - name: Check README exists
      run: test -f README.md && echo "README.md exists"
